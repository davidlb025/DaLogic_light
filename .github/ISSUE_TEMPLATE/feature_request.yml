name: Proponer una mejora
description: Una mejora para la edición web combinacional.
title: '[Mejora] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Qué necesitas resolver
      description: Describe un caso de uso concreto.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta y alternativas
      description: Ten en cuenta el alcance de Light (web estática, combinacional, un bit por puerto).
    validations:
      required: true
