name: Comunicar un fallo
description: Un problema reproducible en DaLogic Light.
title: '[Fallo] '
body:
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Incluye un circuito mínimo o una captura si ayuda. Retira datos personales.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Resultado esperado y resultado observado
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador, versión y sistema operativo
      placeholder: Por ejemplo, Edge 155 en Windows 11
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Dónde lo utilizas
      options:
        - Archivo local (file://)
        - Servidor local (http://localhost o 127.0.0.1)
        - GitHub Pages
        - Otro alojamiento
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit de DaLogic Light
